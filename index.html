<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Overhead · Live Satellite Globe</title>
  <meta name="description" content="A live 3D globe of satellites overhead. Zoom in anywhere to discover landmarks, natural events and which satellites are passing above you right now.">
  <meta name="theme-color" content="#05070f">
  <meta property="og:title" content="Overhead · Live Satellite Globe">
  <meta property="og:description" content="Watch satellites orbit in real time, see when the ISS flies over you, and explore what's around any spot on Earth.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='7' fill='%23ffd166'/><ellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%23ffffff' stroke-width='2' transform='rotate(-25 16 16)'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="map" aria-label="Interactive globe"></div>

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6.5" fill="#ffd166"/><ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(-25 16 16)"/></svg>
      <span>Overhead</span>
      <span class="live"><i></i>LIVE</span>
    </div>
    <form id="search" role="search">
      <input id="q" type="search" placeholder="Search any place…" autocomplete="off" aria-label="Search for a place">
    </form>
    <div class="top-actions">
      <button class="btn" id="locate">📍 Near me</button>
      <button class="btn ghost" id="iss">🛰 Find the ISS</button>
    </div>
  </header>

  <nav id="chips" class="chips" aria-label="Map layers"></nav>

  <aside id="panel" class="panel collapsed">
    <button id="panel-toggle" class="panel-handle" aria-label="Toggle details"><span></span></button>
    <div class="panel-body">
      <section id="sel" class="card accent" hidden></section>
      <section id="sky" class="card"></section>
      <section id="local" class="card"></section>
      <footer class="credits">
        <span id="count">Loading satellites…</span> · <span id="clock"></span><br>
        Orbits <a href="https://celestrak.org" target="_blank" rel="noopener">CelesTrak</a> ·
        Quakes <a href="https://earthquake.usgs.gov" target="_blank" rel="noopener">USGS</a> ·
        Events <a href="https://eonet.gsfc.nasa.gov" target="_blank" rel="noopener">NASA EONET</a> ·
        Places <a href="https://www.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a> ·
        Map <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a><br>
        Built by <a href="https://github.com/Michaelrbacu" target="_blank" rel="noopener">Michael</a> ·
        <a href="https://github.com/Michaelrbacu/website" target="_blank" rel="noopener">Source</a>
      </footer>
    </div>
  </aside>

  <div id="toast" role="status" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
